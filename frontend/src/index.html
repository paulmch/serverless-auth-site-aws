<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Auth Site</title>
    <!--
      Sets <base> so relative asset URLs resolve correctly whether the page is
      reached at /prod or /prod/ (without a trailing slash the browser would
      resolve css/style.css against the root and miss the stage prefix).

      This must run before the stylesheet link is parsed, so it has to be
      inline. The Content-Security-Policy sent with this page whitelists it by
      SHA-256 hash, which the CDK stack computes from this file at synth time -
      editing the script below is safe, the hash follows automatically.
    -->
    <script>
        (function () {
            var match = window.location.pathname.match(/^\/[^\/]+/);
            document.write('<base href="' + (match ? match[0] + '/' : '/') + '">');
        })();
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Serverless Auth Site</h1>
        <div id="user-info">
            <p>Loading user info...</p>
        </div>
        <div id="logout-container">
            <button id="logout-btn" type="button">Logout</button>
        </div>
        <div id="api-response">
            <h2>API Response</h2>
            <pre id="response-data">Fetching...</pre>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
